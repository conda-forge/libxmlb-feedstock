# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: libxmlb
  version: "0.3.29"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/hughsie/${{ name }}/releases/download/${{ version }}/${{ name }}-${{ version }}.tar.xz
  sha256: 448294be33bfae62f00fa66e506f1cae80237ce71b7ab6530aefa75005eeb08a

build:
  number: 0
  skip:
    - win
  script: |
    meson setup ${MESON_ARGS} \
        --prefix=$PREFIX \
        --default-library=shared \
        --wrap-mode=nofallback \
        -Dintrospection=true \
        -Dgtkdoc=false \
        -Dtests=false \
        builddir
    ninja -v -C builddir -j ${CPU_COUNT}
    ninja -C builddir install -j ${CPU_COUNT}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - meson >=0.58.2
    - ninja
    - pkg-config
    - gobject-introspection
  host:
    - glib
    - glib >=2.56.0
    - zlib
    - gobject-introspection
  run_exports:
    - ${{ pin_subpackage('libxmlb', upper_bound='x.x') }}

tests:
  - package_contents:
      files:
        - lib/pkgconfig/xmlb.pc
        - include/libxmlb-2/xmlb.h
      lib:
        - libxmlb

about:
  homepage: https://github.com/hughsie/libxmlb
  summary: 'A library to help create and query binary XML blobs'
  description: |
    XML is slow to parse and strings inside the document cannot
    be memory mapped as they do not have a trailing NUL char.
    The libxmlb library takes XML source, and converts it to a
    structured binary representation with a deduplicated string
    table -- where the strings have the NULs included.
  license: LGPL-2.1-or-later
  license_file: LICENSE
  documentation: https://github.com/hughsie/libxmlb
  repository: https://github.com/hughsie/libxmlb

extra:
  recipe-maintainers:
    - danyeaw
    - ryanvolz
